# cupel — Supabase config (template — copy to config.toml et adapte)
# Author: Aïssa BELKOUSSA

project_id = "cupel"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5309"
additional_redirect_urls = ["http://localhost:5309/auth/callback", "https://cupel.dev/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.email]
enable_signup = false
double_confirm_changes = true

[auth.external.google]
enabled = false
# Activer + renseigner client_id/secret pour OAuth en local

[auth.external.github]
enabled = false
# Activer + renseigner client_id/secret pour OAuth en local

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true

[functions.lemonsqueezy-webhook]
verify_jwt = false
