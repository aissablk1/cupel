name: Security Scan

on:
  schedule:
    - cron: '0 6 * * 1'  # lundi 6h UTC
  workflow_dispatch:

# Moindre privilège : lecture seule par défaut, écriture accordée job par job.
permissions:
  contents: read

jobs:
  cve-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version de pnpm lue dans "packageManager" (package.json) : la redéclarer ici fait échouer l'action.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # publication du SARIF dans l'onglet Security (code scanning)
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        # Épinglé sur le SHA du commit (une étiquette peut être déplacée ou supprimée : « 0.24.0 » n'existe plus).
        # v0.36.0 inclut le correctif de GHSA-9p44-j4g5-cfx5 (corrigé à partir de 0.34.1).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
