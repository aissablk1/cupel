name: Release cupel

# Publication auto sur npm avec provenance (sigstore signature)
# Trigger : git tag cupel-cli-v<version> && git push origin cupel-cli-v<version> (version = packages/cli/package.json)

on:
  push:
    tags:
      - "cupel-cli-v*"

permissions:
  contents: write  # création de la GitHub Release (softprops/action-gh-release)
  id-token: write  # ← obligatoire pour trusted publishing (OIDC) et la provenance sigstore

jobs:
  publish:
    name: Build, test & publish to npm with provenance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Version de pnpm lue dans "packageManager" (package.json) : la redéclarer ici fait échouer l'action.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @aissabelkoussa/cupel --fail-if-no-match typecheck

      - name: Run 37 unit tests
        run: pnpm --filter @aissabelkoussa/cupel --fail-if-no-match test

      - name: Build
        run: pnpm --filter @aissabelkoussa/cupel --fail-if-no-match build

      - name: Smoke test (binary works)
        run: |
          node packages/cli/bin/cupel.mjs --version
          node packages/cli/bin/cupel.mjs --help > /dev/null
          node packages/cli/bin/cupel.mjs --path /tmp --sarif | node -e "JSON.parse(require('fs').readFileSync(0,'utf8'))"

      - name: Verify version matches git tag
        run: |
          tag_version=${GITHUB_REF_NAME#cupel-cli-v}
          pkg_version=$(node -e "console.log(require('./packages/cli/package.json').version)")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag version ($tag_version) does not match package.json version ($pkg_version)"
            exit 1
          fi
          echo "✓ Version match : $tag_version"

      # Trusted Publishing (OIDC) : aucun token npm stocké. Configuré sur npmjs.com pour
      # aissablk1/cupel + release.yml. Exige npm >= 11.5.1 ; la provenance est ajoutée automatiquement.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Publish to npm (trusted publishing, provenance)
        run: cd packages/cli && npm publish --access public

      - name: Create GitHub Release with changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: cupel ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Installation

            ```bash
            npx @aissabelkoussa/cupel
            ```

            Or globally:

            ```bash
            npm i -g @aissabelkoussa/cupel
            ```

            Verify the package signature:

            ```bash
            npm audit signatures
            ```

            ## What's new

            See [CHANGELOG.md](https://github.com/aissablk1/cupel/blob/main/CHANGELOG.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
