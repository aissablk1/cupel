name: cupel CLI

on:
  push:
    branches: [main]
    paths:
      - "packages/cli/**"
      - "packages/shared/**"
      - ".github/workflows/cupel-cli.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/cli/**"
      - "packages/shared/**"
      - ".github/workflows/cupel-cli.yml"

concurrency:
  group: cupel-cli-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.x"]
    steps:
      - uses: actions/checkout@v4

      # Version de pnpm lue dans "packageManager" (package.json) : la redéclarer ici fait échouer l'action.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck cupel
        run: pnpm --filter @aissabelkoussa/cupel --fail-if-no-match typecheck

      - name: Test cupel (37 unit tests)
        run: pnpm --filter @aissabelkoussa/cupel --fail-if-no-match test

      - name: Build cupel
        run: pnpm --filter @aissabelkoussa/cupel --fail-if-no-match build

      - name: Smoke test (binary --help)
        run: node packages/cli/bin/cupel.mjs --help

      - name: Smoke test (binary --version)
        run: node packages/cli/bin/cupel.mjs --version

      - name: Smoke test (SARIF output is valid JSON)
        run: |
          node packages/cli/bin/cupel.mjs --path /tmp --sarif | node -e "JSON.parse(require('fs').readFileSync(0, 'utf8'))"

  audit-supply-chain:
    name: Supply-chain hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No lifecycle scripts in cupel package.json
        run: |
          set -e
          for hook in preinstall postinstall prepublish prepublishOnly preuninstall postuninstall preprepare prepare postprepare; do
            if grep -E "\"$hook\"" packages/cli/package.json > /dev/null 2>&1; then
              echo "::error::Forbidden lifecycle script detected: $hook in packages/cli/package.json"
              exit 1
            fi
          done
          echo "OK — no lifecycle scripts."

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      # Audite les dépendances du CLI telles qu'un utilisateur npm les reçoit : résolution neuve, SANS le lockfile
      # du dépôt (ni ses éventuels overrides), donc exactement ce qu'installe `npx cupel`.
      # La plateforme (apps/web, packages internes) est auditée chaque semaine par security-scan.yml.
      - name: npm audit (CLI as installed by users, fail on high+)
        run: |
          mkdir -p "$RUNNER_TEMP/cupel-user" && cd "$RUNNER_TEMP/cupel-user"
          node -e "const p=require(process.env.GITHUB_WORKSPACE+'/packages/cli/package.json');require('fs').writeFileSync('package.json',JSON.stringify({name:'cupel-user-install',version:'0.0.0',private:true,dependencies:p.dependencies}))"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
